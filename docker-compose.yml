services:
  postgres:
    image: postgres:17
    container_name: field_ops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: field_ops
      POSTGRES_USER: field_ops
      POSTGRES_PASSWORD: field_ops_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U field_ops -d field_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
